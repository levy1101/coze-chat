<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coze Chatbot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #coze-chat-container {
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            background: white;
        }

        #custom-chat-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #28a745;
            border: none;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <button id="custom-chat-button" onclick="toggleChat()">
        <i class="bi bi-chat-dots-fill"></i>
    </button>

    <script
        src="https://sf-cdn.coze.com/obj/unpkg-va/flow-platform/chat-app-sdk/1.2.0-beta.5/libs/oversea/index.js"></script>
    <script>
        const cozeWebSDK = new CozeWebSDK.WebChatClient({
            config: {
                botId: '7486457067655086081',
                isIframe: false,
            },
            auth: {
                type: 'token',
                token: 'pat_PGU51l4YUnQWn6XCJS2NGMbiZF2AslbMp5TWFWR2IgM0absyW6yLInNlXLm03LAQ',
                onRefreshToken: async () => 'pat_PGU51l4YUnQWn6XCJS2NGMbiZF2AslbMp5TWFWR2IgM0absyW6yLInNlXLm03LAQ'
            },
            userInfo: { id: 'user123' },
            ui: {
                base: {
                    layout: 'mobile',
                    zIndex: 1000
                },
                asstBtn: { isNeed: false },
                footer: { isShow: false }
            }
        });

        let isChatVisible = false;
        function toggleChat() {
            if (isChatVisible) {
                cozeWebSDK.hideChatBot();
            } else {
                cozeWebSDK.showChatBot();
            }
            isChatVisible = !isChatVisible;
        }
    </script>
</body>

</html>
